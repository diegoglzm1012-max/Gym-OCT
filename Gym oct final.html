<style>
:root{--bg:#080808;--s1:#111;--s2:#1a1a1a;--border:#2a2a2a;--acc:#d4f53c;--org:#f5823c;--blu:#3ca8f5;--pur:#a83cf5;--grn:#3cf5a8;--txt:#f2f2f2;--mut:#666;--r:12px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;padding:var(--st) 0 calc(var(--sb)+16px)}
/* HEADER */
.top{padding:20px 16px 12px;position:sticky;top:var(--st);background:rgba(8,8,8,.95);backdrop-filter:blur(12px);z-index:50;border-bottom:1px solid var(--border)}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.top p{font-size:12px;color:var(--mut);margin-top:3px}
/* WEEK TABS */
.wtabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0;scrollbar-width:none}
.wtabs::-webkit-scrollbar{display:none}
.wtab{flex-shrink:0;padding:7px 14px;border-radius:20px;background:var(--s1);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;transition:all .15s}
.wtab.on{background:var(--acc);border-color:var(--acc);color:#000}
/* WEEK SECTION */
.week{display:none;padding:12px 16px 0}
.week.on{display:block}
/* DAY CARD */
.day{margin-bottom:14px;border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.day-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;background:var(--s1)}
.day-left{}
.day-date{font-size:13px;font-weight:700}
.day-tri{font-size:11px;color:var(--mut);margin-top:2px}
.day-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;flex-shrink:0;margin-left:8px}
.b-hard{background:rgba(245,130,60,.15);color:var(--org)}
.b-mod{background:rgba(212,245,60,.1);color:var(--acc)}
.b-light{background:rgba(60,168,245,.1);color:var(--blu)}
.b-mob{background:rgba(102,102,102,.15);color:var(--mut)}
/* SECTION */
.sec{padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}
.sec-title{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--mut);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.hx-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;background:rgba(168,60,245,.15);color:var(--pur)}
/* EXERCISE ROW */
.ex{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.ex:last-child{border-bottom:none}
.ex-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.il{background:rgba(212,245,60,.08)}
.iu{background:rgba(60,168,245,.08)}
.ic{background:rgba(245,130,60,.08)}
.ih{background:rgba(168,60,245,.1)}
.im{background:rgba(102,102,102,.1)}
.ex-info{flex:1}
.ex-name{font-size:13px;font-weight:600;line-height:1.3}
.ex-det{font-size:11px;color:var(--mut);margin-top:2px}
.ex-sets{font-size:12px;font-weight:700;color:var(--acc);flex-shrink:0;font-family:monospace;white-space:nowrap}
.ex-tip{font-size:11px;color:rgba(212,245,60,.6);margin-top:4px;line-height:1.4;display:none}
.ex:active .ex-tip{display:block}
/* HX INDICATOR */
.ex.hx .ex-name::before{content:'⚡ ';font-size:11px}
</style>
</head>

// ── BUILD UI ───────────────────────────────────────────────────────────────
const tabs = document.getElementById('wtabs');
const weeks = document.getElementById('weeks');

W.forEach((wk, wi) => {
  // Tab
  const tab = document.createElement('div');
  tab.className = 'wtab' + (wi === 0 ? ' on' : '');
  tab.textContent = wk.label;
  tab.onclick = () => {
    document.querySelectorAll('.wtab').forEach(t => t.classList.remove('on'));
    document.querySelectorAll('.week').forEach(w => w.classList.remove('on'));
    tab.classList.add('on');
    document.getElementById('week-'+wi).classList.add('on');
  };
  tabs.appendChild(tab);

  // Week div
  const wdiv = document.createElement('div');
  wdiv.className = 'week' + (wi === 0 ? ' on' : '');
  wdiv.id = 'week-' + wi;

  wk.days.forEach(day => {
    let html = `<div class="day">
      <div class="day-head">
        <div class="day-left">
          <div class="day-date">${day.date}</div>
          <div class="day-tri">${day.tri}</div>
        </div>
        <div class="day-badge ${day.badge}">${day.badgeL}</div>
      </div>`;

    day.secs.forEach(sec => {
      const hasHx = sec.exs.some(e => e.hx);
      html += `<div class="sec">
        <div class="sec-title">${sec.t}${hasHx ? ' <span class="hx-tag">HYROX</span>' : ''}</div>`;
      sec.exs.forEach(ex => {
        html += `<div class="ex${ex.hx ? ' hx' : ''}">
          <div class="ex-ico ${sec.cls}">${sec.t.split(' ')[0]}</div>
          <div class="ex-info">
            <div class="ex-name">${ex.n}</div>
            <div class="ex-det">${ex.d}</div>
            <div class="ex-tip">💡 ${ex.tip}</div>
          </div>
          <div class="ex-sets">${ex.s}</div>
        </div>`;
      });
      html += `</div>`;
    });

    html += `</div>`;
    wdiv.innerHTML += html;
  });

  weeks.appendChild(wdiv);
});

// Auto-select current week
const start = new Date(2026,8,27);
const diff = Math.floor((new Date()-start)/86400000);
const wi = Math.max(0, Math.min(Math.floor(diff/7), W.length-1));
document.querySelectorAll('.wtab')[wi]?.click();
